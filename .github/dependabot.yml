version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      rust:
        patterns:
          - "*"
    # cpal, windows-core, and windows-registry need code migrations
    # (cpal 0.16+ audio stream API, windows 0.59+ PROPERTYKEY move and
    # implement macro change). Hold them back until that work lands;
    # the rest of the group stays mergeable.
    ignore:
      - dependency-name: "cpal"
      - dependency-name: "windows-core"
      - dependency-name: "windows-registry"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
