version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      rust:
        patterns:
          - "*"
    # cpal 0.18, windows-core 0.62, and windows-registry 0.100 need
    # code migrations (audio stream API, PROPERTYKEY move, implement
    # macro change). Hold them back until that work lands; the rest of
    # the group stays mergeable.
    ignore:
      - dependency-name: "cpal"
        versions: [">=0.18"]
      - dependency-name: "windows-core"
        versions: [">=0.62"]
      - dependency-name: "windows-registry"
        versions: [">=0.100"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
