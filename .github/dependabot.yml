version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
