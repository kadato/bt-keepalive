name: Release

# Tags like v2.0.0 or a manual dispatch build the Windows exe, the
# Inno Setup installer, and checksums, then publish them to the
# GitHub Release for the tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build release exe
        run: cargo build --release -p btkeepalive-app

      - name: Stage WebView2Loader.dll next to exe
        shell: pwsh
        run: |
          $loader = Get-ChildItem -Path target\release\build -Recurse -Filter WebView2Loader.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $loader) { throw "WebView2Loader.dll (x64) not found under target\release\build" }
          Copy-Item $loader.FullName target\release\WebView2Loader.dll
          Get-Item target\release\BTKeepAlive.exe, target\release\WebView2Loader.dll | Format-Table Name, Length

      - name: Smoke test exe
        shell: pwsh
        run: |
          .\target\release\BTKeepAlive.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wav = Join-Path $env:RUNNER_TEMP "smoke.wav"
          .\target\release\BTKeepAlive.exe --render-wav $wav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $wav)) { exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc installer\BTKeepAlive.iss

      - name: Build portable zip (exe plus WebView2Loader.dll)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target\release\BTKeepAlive.exe, target\release\WebView2Loader.dll -DestinationPath dist\BTKeepAlive-portable.zip -Force

      - name: Compute checksums
        shell: pwsh
        run: |
          $exe = Get-FileHash -Path target\release\BTKeepAlive.exe -Algorithm SHA256
          $loader = Get-FileHash -Path target\release\WebView2Loader.dll -Algorithm SHA256
          $setup = Get-FileHash -Path dist\BTKeepAlive-setup.exe -Algorithm SHA256
          $zip = Get-FileHash -Path dist\BTKeepAlive-portable.zip -Algorithm SHA256
          "$($exe.Hash)  BTKeepAlive.exe" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8
          "$($loader.Hash)  WebView2Loader.dll" | Out-File -FilePath dist\SHA256SUMS.txt -Append -Encoding utf8
          "$($setup.Hash)  BTKeepAlive-setup.exe" | Out-File -FilePath dist\SHA256SUMS.txt -Append -Encoding utf8
          "$($zip.Hash)  BTKeepAlive-portable.zip" | Out-File -FilePath dist\SHA256SUMS.txt -Append -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btkeepalive-windows
          path: |
            target/release/BTKeepAlive.exe
            target/release/WebView2Loader.dll
            dist/BTKeepAlive-setup.exe
            dist/BTKeepAlive-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BTKeepAlive-setup.exe
            dist/BTKeepAlive-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
