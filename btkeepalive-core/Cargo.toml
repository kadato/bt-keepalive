[package]
name = "btkeepalive-core"
version = "0.1.0"
description = "Portable core for BT KeepAlive: config, volume, DSP noise, binaural beats, pulse timing"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_distr = "0.5"

[dev-dependencies]
tempfile = "3"
